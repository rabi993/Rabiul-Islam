<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>
<style>
    body { font-family: Arial, sans-serif; background-color: #f0f0f0; padding: 20px; }
    .contact-form { max-width: 500px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
    .contact-form h2 { text-align: center; color: #333; }
    .contact-form input, .contact-form textarea { width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .contact-form button { width: 100%; padding: 10px; background-color: #3498db; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    .contact-form button:hover { background-color: #2980b9; }
    .contact-info { text-align: center; margin-top: 20px; }
    .contact-info p { margin: 5px 0; }
</style>
</head>
<body>

<div class="contact-form">
    <h2>Contact Us</h2>
    <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <input type="tel" id="phone" placeholder="Your Phone Number" required>
        <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
        <button type="submit">Send Message</button>
    </form>
</div>

<div class="contact-info">
    <h3>Contact Information</h3>
    <p>Phone: +8801234567890</p>
    <p>Email: example@gmail.com</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
    (function() {
        emailjs.init(env("YOUR_PUBLIC_KEY"));  // Replace with your EmailJS public key
    })();

    document.getElementById('contactForm').addEventListener('submit', function(event) {
        event.preventDefault();

        // Collect form data
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const message = document.getElementById('message').value;

        // Validate form data
        if (!name || !email || !phone || !message) {
            alert('Please fill in all fields.');
            return;
        }

        // Send email using EmailJS
        emailjs.send(env("YOUR_SERVICE_ID"), env("YOUR_TEMPLATE_ID"), {
            from_name: name,
            from_email: email,
            phone_number: phone,
            message: message
        }).then(function(response) {
            alert("Message sent successfully!");
            document.getElementById('contactForm').reset();
        }, function(error) {
            alert("Failed to send message. Please try again later.");
        });
    });
</script>

</body>
</html>
